name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch tags so the "Check if tag exists" step actually finds existing
          # tags. Without this, `git rev-parse <tag>` always exits non-zero on
          # the runner's shallow clone, the tag check always reports "doesn't
          # exist", and the workflow attempts to release the same version twice
          # whenever a non-doc commit lands without a version bump.
          fetch-tags: true
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run build

      - name: Get version
        id: version
        run: echo "version=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION=$(jq -r .version package.json)
          # Extract the section for this version from CHANGELOG.md
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release ${VERSION}"
          fi
          # Write to file to preserve newlines
          echo "$BODY" > /tmp/release-notes.md

      - name: Create release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file /tmp/release-notes.md \
            dist/spotify-darwin-arm64 \
            dist/spotify-darwin-x64 \
            dist/spotify-linux-x64 \
            dist/spotify-linux-arm64 \
            dist/spotify-windows-x64.exe

      - name: Update Homebrew formula
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          SHA_DARWIN_ARM64=$(shasum -a 256 dist/spotify-darwin-arm64 | awk '{print $1}')
          SHA_DARWIN_X64=$(shasum -a 256 dist/spotify-darwin-x64 | awk '{print $1}')
          SHA_LINUX_X64=$(shasum -a 256 dist/spotify-linux-x64 | awk '{print $1}')
          SHA_LINUX_ARM64=$(shasum -a 256 dist/spotify-linux-arm64 | awk '{print $1}')

          cat > /tmp/spotify-cli.rb << FORMULA
          class SpotifyCli < Formula
            desc "Agent (and human) friendly CLI for Spotify. JSON output. PKCE auth."
            homepage "https://spotify-cli.zach.dev"
            license "MIT"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/zcaceres/spotify-cli/releases/download/v#{version}/spotify-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/zcaceres/spotify-cli/releases/download/v#{version}/spotify-darwin-x64"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/zcaceres/spotify-cli/releases/download/v#{version}/spotify-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/zcaceres/spotify-cli/releases/download/v#{version}/spotify-linux-x64"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              binary = Dir.glob("spotify-*").first
              bin.install binary => "spotify"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/spotify --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' /tmp/spotify-cli.rb

          gh api repos/zcaceres/homebrew-tap/contents/Formula/spotify-cli.rb \
            --method PUT \
            --field message="update spotify-cli to ${VERSION}" \
            --field content="$(base64 -w0 /tmp/spotify-cli.rb)" \
            --field sha="$(gh api repos/zcaceres/homebrew-tap/contents/Formula/spotify-cli.rb --jq .sha)"
